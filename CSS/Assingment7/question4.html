<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadows and Depth Effects</title>
  <link rel="stylesheet" href="question4.css" />
</head>
<body>
  <header>
    <h1>Shadows and Depth Effect Layout</h1>
  </header>

  <main>
    <section class="card-container">
      <article class="card light-shadow">
        <h2>Card One</h2>
        <p>Subtle shadow for a soft floating look.</p>
      </article>

      <article class="card medium-shadow">
        <h2>Card Two</h2>
        <p>Medium shadow gives more depth and contrast.</p>
      </article>

      <article class="card dark-shadow">
        <h2>Card Three</h2>
        <p>Dark shadow for a strong, lifted appearance.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>Created for CSS Shadows and Depth Practice</p>
  </footer>
</body>
</html>
